<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntegralLab - Visualizador 3D Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0B0F19; /* Fondo temático oscuro Glass/Dark */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #hud-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 11px;
            background: rgba(15, 23, 42, 0.75);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }
        #fallback {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            color: #E8ECF8;
            font-size: 14px;
            line-height: 1.5;
        }
        #fallback small { color: #8B95B5; display: block; margin-top: 8px; font-size: 11px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud-overlay">IntegralLab 3D • Arrastre: rotar • Rueda: zoom • Clic derecho: trasladar • Doble clic: reencuadrar</div>
    <div id="fallback"><div>No se pudo iniciar WebGL en este equipo.<br>IntegralLab usará el motor Matplotlib.<small id="fallback-reason"></small></div></div>

    <script type="importmap">
    {
        "imports": {
            "three": "./js/three.module.min.js",
            "three/addons/controls/OrbitControls.js": "./js/OrbitControls.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ────────────────────────────────────────────────────────────────────────
        // 0. Estado consultable desde Python ANTES de crear el contexto WebGL.
        //    Si WebGL no existe (GPU en lista negra, VM, escritorio remoto), Python
        //    lo sabe por status() y cambia al motor Matplotlib en vez de mostrar
        //    una vista negra sin explicación.
        // ────────────────────────────────────────────────────────────────────────
        const status = { ok: false, reason: 'inicializando', renderer: '' };
        window.IntegralLab3D = { status: () => JSON.stringify(status) };

        function showFallback(reason) {
            const box = document.getElementById('fallback');
            document.getElementById('fallback-reason').textContent = reason || '';
            box.style.display = 'flex';
            document.getElementById('hud-overlay').style.display = 'none';
        }

        function init() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(10, 8, 12);

            // Lanza una excepción si no hay WebGL: la captura el bloque try de abajo.
            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            const baseDPR = Math.min(window.devicePixelRatio || 1, 2);
            renderer.setPixelRatio(baseDPR);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);
            try {
                const gl = renderer.getContext();
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                status.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
            } catch (e) { /* solo informativo */ }

            // ────────────────────────────────────────────────────────────────────
            // 1. Controles y render bajo demanda
            //    Antes se renderizaba a 60 FPS siempre, aunque nada cambiara. Ahora
            //    solo se dibuja cuando la cámara se mueve, hay inercia (damping),
            //    auto-rotación o un sólido nuevo: en reposo el coste es cero.
            // ────────────────────────────────────────────────────────────────────
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.autoRotateSpeed = 1.0;
            controls.minDistance = 0.05;
            controls.maxDistance = 500;
            controls.target.set(0, 0, 0);

            const prefs = { autoRotate: true };
            controls.autoRotate = prefs.autoRotate;

            let renderRequested = false;
            let frames = 0;
            function requestRender() {
                if (!renderRequested) {
                    renderRequested = true;
                    requestAnimationFrame(frame);
                }
            }
            function frame() {
                renderRequested = false;
                controls.update();          // emite 'change' (y pide otro frame) mientras haya inercia
                renderer.render(scene, camera);
                frames++;
                if (controls.autoRotate) requestRender();
            }
            controls.addEventListener('change', requestRender);

            // Resolución adaptativa: en pantallas HiDPI se dibuja a 1x mientras el
            // usuario arrastra (4 veces menos píxeles) y se restaura al soltar.
            let interacting = false;
            let restoreTimer = null;
            controls.addEventListener('start', () => {
                interacting = true;
                controls.autoRotate = false;
                if (restoreTimer) { clearTimeout(restoreTimer); restoreTimer = null; }
                if (baseDPR > 1 && renderer.getPixelRatio() !== 1) renderer.setPixelRatio(1);
                requestRender();
            });
            controls.addEventListener('end', () => {
                interacting = false;
                if (baseDPR > 1) {
                    restoreTimer = setTimeout(() => {
                        if (!interacting) { renderer.setPixelRatio(baseDPR); requestRender(); }
                    }, 300);
                }
            });

            // ────────────────────────────────────────────────────────────────────
            // 2. Iluminación y grilla
            // ────────────────────────────────────────────────────────────────────
            scene.add(new THREE.AmbientLight(0xffffff, 0.45));
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.95);
            dirLight1.position.set(15, 25, 20);
            scene.add(dirLight1);
            const dirLight2 = new THREE.DirectionalLight(0x5ce1ff, 0.55);
            dirLight2.position.set(-15, -10, -15);
            scene.add(dirLight2);

            let gridHelper = new THREE.GridHelper(20, 20, 0x334155, 0x1e293b);
            scene.add(gridHelper);

            function updateGrid(box, maxDim) {
                // La grilla va como "piso" BAJO el sólido y centrada en él. Antes quedaba
                // fija en y = 0 y centrada en el origen: cortaba el sólido por la mitad y
                // no aparecía bajo sólidos desplazados.
                scene.remove(gridHelper);
                gridHelper.geometry.dispose();
                gridHelper.material.dispose();
                const gridSize = Math.max(Math.ceil(maxDim * 2.5), 1);
                const divisions = Math.min(Math.max(Math.ceil(gridSize / 2), 10), 40);
                gridHelper = new THREE.GridHelper(gridSize, divisions, 0x334155, 0x1e293b);
                const center = box.getCenter(new THREE.Vector3());
                gridHelper.position.set(center.x, box.min.y - 0.02 * maxDim, center.z);
                scene.add(gridHelper);
            }

            // ────────────────────────────────────────────────────────────────────
            // 3. Geometría a partir de la malla de Python
            // ────────────────────────────────────────────────────────────────────
            let solidGroup = new THREE.Group();
            scene.add(solidGroup);
            let lastData = null;

            function decodeFloat32(b64) {
                // Formato binario: float32 little-endian intercalado x, y, z codificado en base64.
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                return new Float32Array(bytes.buffer);
            }

            function readPositions(grid) {
                if (grid.positions_b64) return decodeFloat32(grid.positions_b64);
                if (!grid.x || !grid.y || !grid.z) return null;
                // Formato JSON antiguo (listas x, y, z): se mantiene por compatibilidad.
                const n = grid.x.length;
                const out = new Float32Array(n * 3);
                for (let i = 0; i < n; i++) {
                    out[i * 3] = grid.x[i];
                    out[i * 3 + 1] = grid.y[i];
                    out[i * 3 + 2] = grid.z[i];
                }
                return out;
            }

            /**
             * Superficie de revolución indexada (filas = perfil, columnas = ángulo).
             * Si la última columna repite la primera (θ = 0 y θ = 2π), se suelda: así las
             * normales son continuas y desaparece la costura visible en el sombreado.
             */
            function buildSurface(grid) {
                if (!grid) return null;
                const rows = grid.rows | 0;
                const cols = grid.cols | 0;
                const src = readPositions(grid);
                if (!src || rows < 2 || cols < 2 || src.length !== rows * cols * 3) return null;

                let span = 0;
                for (let k = 0; k < src.length; k++) span = Math.max(span, Math.abs(src[k]));
                const tol = 1e-5 * Math.max(1, span);
                let duplicatedSeam = cols > 2;
                for (let i = 0; i < rows && duplicatedSeam; i++) {
                    const a = (i * cols) * 3;
                    const b = (i * cols + cols - 1) * 3;
                    for (let c = 0; c < 3; c++) {
                        if (Math.abs(src[a + c] - src[b + c]) > tol) { duplicatedSeam = false; break; }
                    }
                }
                const uc = duplicatedSeam ? cols - 1 : cols;

                const pos = new Float32Array(rows * uc * 3);
                for (let i = 0; i < rows; i++) {
                    pos.set(src.subarray(i * cols * 3, (i * cols + uc) * 3), i * uc * 3);
                }
                const numQuadsJ = duplicatedSeam ? uc : uc - 1;
                const IndexArray = rows * uc > 65535 ? Uint32Array : Uint16Array;
                const idx = new IndexArray((rows - 1) * numQuadsJ * 6);
                let k = 0;
                for (let i = 0; i < rows - 1; i++) {
                    for (let j = 0; j < numQuadsJ; j++) {
                        const jn = duplicatedSeam ? (j + 1) % uc : j + 1;
                        const v00 = i * uc + j, v01 = i * uc + jn;
                        const v10 = (i + 1) * uc + j, v11 = (i + 1) * uc + jn;
                        idx[k++] = v00; idx[k++] = v10; idx[k++] = v01;
                        idx[k++] = v01; idx[k++] = v10; idx[k++] = v11;
                    }
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geometry.setIndex(new THREE.BufferAttribute(idx, 1));
                geometry.computeVertexNormals();
                return { geometry, pos, rows, uc, duplicatedSeam };
            }

            /**
             * Tapa del anillo r (r = 0 → extremo a; r = filas-1 → extremo b): une el anillo de
             * la superficie exterior con el de la interior (corona circular o pared cilíndrica)
             * o, sin superficie interior y con eje horizontal, con el centro del eje (disco).
             * Antes el sólido se veía hueco, sin caras en los extremos. Solo reutiliza vértices
             * que ya envió Python; no recalcula nada de la geometría matemática.
             * Devuelve { geometry, radius } (radius = distancia media del anillo al eje).
             */
            function buildCap(outer, inner, axis, r) {
                if (!outer || !axis) return null;
                if (inner && (inner.rows !== outer.rows || inner.uc !== outer.uc)) return null;
                if (!inner && axis.orientation !== 'horizontal') return null;
                const uc = outer.uc;
                const numCapQuads = outer.duplicatedSeam ? uc : uc - 1;
                const verts = new Float32Array(2 * uc * 3);
                const idx = new (2 * uc > 65535 ? Uint32Array : Uint16Array)(numCapQuads * 6);
                let vk = 0, ik = 0, radius = 0;
                for (let j = 0; j < uc; j++) {
                    const o = (r * uc + j) * 3;
                    const x = outer.pos[o], y = outer.pos[o + 1], z = outer.pos[o + 2];
                    verts[vk++] = x; verts[vk++] = y; verts[vk++] = z;
                    radius += axis.orientation === 'horizontal'
                        ? Math.hypot(y - axis.position, z) : Math.hypot(x - axis.position, z);
                }
                for (let j = 0; j < uc; j++) {
                    if (inner) {
                        const o = (r * uc + j) * 3;
                        verts[vk++] = inner.pos[o]; verts[vk++] = inner.pos[o + 1]; verts[vk++] = inner.pos[o + 2];
                    } else {
                        verts[vk++] = outer.pos[(r * uc) * 3]; verts[vk++] = axis.position; verts[vk++] = 0;
                    }
                }
                for (let j = 0; j < numCapQuads; j++) {
                    const jn = outer.duplicatedSeam ? (j + 1) % uc : j + 1;
                    const a = j, b = jn, c = uc + j, d = uc + jn;
                    idx[ik++] = a; idx[ik++] = c; idx[ik++] = b;
                    idx[ik++] = b; idx[ik++] = c; idx[ik++] = d;
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                geometry.setIndex(new THREE.BufferAttribute(idx, 1));
                geometry.computeVertexNormals();
                return { geometry, radius: radius / uc };
            }

            function colorOf(hex, fallback) {
                try { return new THREE.Color(hex || fallback); } catch (e) { return new THREE.Color(fallback); }
            }

            function renderSolidMesh(data) {
                clearCanvas();
                lastData = data || null;
                if (!data) { requestRender(); return; }
                const alpha = (typeof data.alpha === 'number') ? data.alpha : 0.6;

                const outer = buildSurface(data.outer);
                const inner = buildSurface(data.inner);

                // Dos materiales con significado: "envolvente" (cian, translúcido, sin escribir
                // profundidad) y "hueco" (rosa, más opaco, escribe profundidad y se dibuja
                // primero). Antes la superficie interior tapaba a la exterior y, con eje vertical,
                // la base del sólido salía rosa como si fuera un hueco.
                const hullMat = new THREE.MeshStandardMaterial({
                    color: colorOf(data.color_outer, '#5CE1FF'),
                    roughness: 0.55, metalness: 0.05,
                    transparent: true, opacity: alpha,
                    side: THREE.DoubleSide, depthWrite: false,
                });
                const holeMat = new THREE.MeshStandardMaterial({
                    color: colorOf(data.color_inner, '#FF6B8A'),
                    roughness: 0.55, metalness: 0.05,
                    transparent: true, opacity: Math.min(alpha + 0.25, 0.92),
                    side: THREE.DoubleSide, depthWrite: true,
                });
                const addMesh = (geometry, material, order) => {
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.renderOrder = order;
                    solidGroup.add(mesh);
                };
                const axis = data.axis || null;
                const vertical = !!axis && axis.orientation === 'vertical';

                // Eje horizontal: la superficie interior es el hueco de la arandela.
                // Eje vertical: "outer"/"inner" son el techo y la base (ambos exteriores) y el
                // hueco es la pared cilíndrica más cercana al eje.
                if (inner) addMesh(inner.geometry, vertical ? hullMat : holeMat, vertical ? 2 : 1);
                if (outer) {
                    addMesh(outer.geometry, hullMat, 2);
                    const caps = [buildCap(outer, inner, axis, 0), buildCap(outer, inner, axis, outer.rows - 1)]
                        .filter(Boolean);
                    const minRadius = Math.min(...caps.map(c => c.radius));
                    for (const cap of caps) {
                        const isHoleWall = vertical && caps.length === 2 && cap.radius === minRadius
                            && cap.radius > 1e-6;
                        addMesh(cap.geometry, isHoleWall ? holeMat : hullMat, isHoleWall ? 1 : 2);
                    }
                }

                const box = new THREE.Box3().setFromObject(solidGroup);
                const size = box.isEmpty() ? new THREE.Vector3(2, 2, 2) : box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z, 1e-3);

                if (data.axis_line) {
                    const ax = data.axis_line.x || [], ay = data.axis_line.y || [], az = data.axis_line.z || [];
                    const pts = [];
                    for (let i = 0; i < ax.length; i++) pts.push(new THREE.Vector3(ax[i], ay[i], az[i]));
                    if (pts.length >= 2) {
                        const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
                        const lineMat = new THREE.LineDashedMaterial({
                            color: 0xffa500, dashSize: maxDim * 0.04, gapSize: maxDim * 0.02,
                        });
                        const axisLine = new THREE.Line(lineGeom, lineMat);
                        axisLine.computeLineDistances();
                        axisLine.renderOrder = 3;
                        solidGroup.add(axisLine);
                    }
                }

                if (data.fit_camera !== false) fitCameraToObject(solidGroup);
                controls.autoRotate = prefs.autoRotate;
                requestRender();
            }

            function clearCanvas() {
                const materials = new Set();
                while (solidGroup.children.length > 0) {
                    const obj = solidGroup.children[0];
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => materials.add(m));
                    }
                    solidGroup.remove(obj);
                }
                materials.forEach(m => m.dispose());
                requestRender();
            }

            function fitCameraToObject(object) {
                const box = new THREE.Box3().setFromObject(object);
                if (box.isEmpty()) return;
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z, 1e-3);

                camera.near = maxDim * 0.001;
                camera.far = maxDim * 200;
                camera.updateProjectionMatrix();

                // Los límites de zoom escalan con el sólido. Antes eran fijos (0.5–500): con
                // f = x² en [0, 30] (radio 900) la cámara quedaba recortada a 500, DENTRO del sólido.
                controls.minDistance = maxDim * 0.02;
                controls.maxDistance = maxDim * 50;

                controls.target.copy(center);
                const distance = maxDim * 2.2;
                camera.position.set(center.x + distance * 0.7, center.y + distance * 0.5, center.z + distance * 0.8);
                camera.lookAt(center);
                controls.update();
                updateGrid(box, maxDim);
                requestRender();
            }

            function onResize() {
                camera.aspect = Math.max(window.innerWidth, 1) / Math.max(window.innerHeight, 1);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                requestRender();
            }
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('dblclick', () => fitCameraToObject(solidGroup));

            // Pérdida de contexto (driver reiniciado, GPU saturada): se informa a Python.
            renderer.domElement.addEventListener('webglcontextlost', (ev) => {
                ev.preventDefault();
                status.ok = false;
                status.reason = 'Se perdió el contexto WebGL.';
            });
            renderer.domElement.addEventListener('webglcontextrestored', () => {
                status.ok = true;
                status.reason = '';
                if (lastData) renderSolidMesh(lastData);
            });

            // ────────────────────────────────────────────────────────────────────
            // 4. API global para PySide6 (QWebEngineView.runJavaScript)
            // ────────────────────────────────────────────────────────────────────
            window.IntegralLab3D = {
                status: () => JSON.stringify(status),
                renderSolid: (data) => {
                    renderSolidMesh(data);
                    return JSON.stringify({ ok: status.ok, reason: status.reason, meshes: solidGroup.children.length });
                },
                clearCanvas: () => { lastData = null; clearCanvas(); },
                setAutoRotate: (enabled) => {
                    prefs.autoRotate = Boolean(enabled);
                    controls.autoRotate = prefs.autoRotate;
                    requestRender();
                },
                zoom: (factor) => {
                    // Acerca o aleja respecto al objetivo de la cámara (antes era respecto al
                    // origen del mundo: con sólidos desplazados el zoom se salía del objeto).
                    const offset = camera.position.clone().sub(controls.target).multiplyScalar(factor);
                    camera.position.copy(controls.target).add(offset);
                    controls.update();
                    requestRender();
                },
                fitCamera: () => fitCameraToObject(solidGroup),
                getSolidGroup: () => solidGroup,
                getMeshCount: () => solidGroup.children.length,
                stats: () => JSON.stringify({
                    geometries: renderer.info.memory.geometries,
                    textures: renderer.info.memory.textures,
                    programs: (renderer.info.programs || []).length,
                    sceneChildren: scene.children.length,
                    frames: frames,
                    pixelRatio: renderer.getPixelRatio(),
                }),
            };
            requestRender();
        }

        try {
            init();
            status.ok = true;
            status.reason = '';
        } catch (err) {
            status.ok = false;
            status.reason = String((err && err.message) || err);
            showFallback(status.reason);
            console.error('IntegralLab3D: WebGL no disponible: ' + status.reason);
        }
    </script>
</body>
</html>

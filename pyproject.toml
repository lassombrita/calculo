[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "integrallab"
version = "2026.11.14.3"
description = "Calculadora simbólica de integrales definidas, volumen de sólidos de revolución y área entre curvas con interfaz gráfica PySide6 (Glass/Dark), visualización 3D offline Three.js WebGL, interpolación numérica, exportación PDF, motor pedagógico universitario (detector de técnica [R(x)]², pasos explicados) + árbol de fórmulas MathJax."
readme = "README.md"
authors = [
    {name = "Johan Stiven Lasso Aguirre", email = "j.lasso@example.com"},  # Nombre del autor, email genérico para cumplir con el esquema de Python Packaging
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz3d = [
    "PySide6-Addons>=6.6",  # Incluye QWebEngineWidgets para Three.js
]

[tool.setuptools.package-data]
integrallab = ["resources/**/*", "resources/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["integrallab*"]
exclude = ["integrallab.viz.experimental*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[[tool.mypy.overrides]]
module = [
    "IPython.*", "matplotlib.*", "sympy.*", "_tests.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.codespell]
skip = "*.git,*.png,*.jpg,cache/*,.pytest_cache/*"
ignore-words-list = "nd,inam"

[project.scripts]
integrallab = "integrallab.__main__:run"

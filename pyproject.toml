[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "integrallab"
version = "0.1.0"
description = "Herramienta interactiva para análisis, cálculo simbólico/numérico y visualización matemática."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz3d = [
    "PySide6-Addons>=6.6",  # Incluye QWebEngineWidgets para Three.js
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "integrallab"
version = "2026.10.27"
description = "Calculadora simbólica de integrales definidas, volumen de sólidos de revolución y área entre curvas con interfaz gráfica PySide6 (Glass/Dark), visualización 3D offline Three.js WebGL, interpolación numérica, exportación PDF, motor pedagógico universitario (detector de técnica [R(x)]², pasos explicados) + árbol de fórmulas MathJax."
readme = "README.md"
authors = [
    {name = "Johan Stiven Lasso Aguirre"}  # Nombre del autor; email no incluido para cumplir con PRIVACIDAD.md (N3)
]
license = {text = "Todos los derechos reservados"}
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "PySide6>=6.6",
    "mpmath>=1.3",  # Cuadratura numérica para referencia independiente
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz3d = [
    "PySide6-Addons>=6.6",  # Incluye QWebEngineWidgets para Three.js
]

[tool.setuptools.package-data]
integrallab = ["resources/**/*", "resources/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["integrallab*"]
exclude = ["integrallab.viz.experimental*", "integrallab.tests*", "integrallab/core/domain*", 
           "integrallab/core/migration.py", "integrallab/core/mesh.py", "integrallab/core/volume/calculation.py",
           "integrallab/core/volume/meshing/*", "legacy_compat*", "ui/photomath/*", "ui/controllers*", 
           "tests*"]  # tests excluido: testpaths en pytest.ini

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[[tool.mypy.overrides]]
module = [
    "IPython.*", "matplotlib.*", "sympy.*", "_tests.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"  # Python 3.10 o superior, no 3.11

[tool.codespell]
skip = "*.git,*.png,*.jpg,cache/*,.pytest_cache/*"
ignore-words-list = "nd,inam"

[project.scripts]
integrallab = "integrallab.__main__:run"
# Nota: El comando "integrallab" está en pyproject.toml. La función run() ya existe en __main__.py.

<EOF>
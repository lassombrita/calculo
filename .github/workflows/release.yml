name: Build and Release IntegralLab

on:
  release:
    types: [created]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Puedes ajustarlo a la versión que prefieras

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      # --onefile: Un solo ejecutable
      # --windowed: Oculta la consola negra
      # --add-data: Empaqueta todos los recursos de integrallab (MathJax, UI, etc.)
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "IntegralLab" --add-data "integrallab;integrallab" integrallab/__main__.py

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/IntegralLab.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


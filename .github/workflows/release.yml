name: Build and Release IntegralLab

on:
  release:
    types: [created]
  workflow_dispatch: # Permite ejecutarlo manualmente

# ESTA ES LA LÍNEA CLAVE QUE CORRIGE EL ERROR DE PERMISOS
permissions:
  contents: write 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Versión de Python para compilar

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "IntegralLab" --add-data "integrallab;integrallab" integrallab/__main__.py

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/IntegralLab.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
